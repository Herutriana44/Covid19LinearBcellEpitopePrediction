name: Neural Network Experiment

on:
  push:
    branches: [ main, master ]

jobs:
  run_experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn tensorflow hmmlearn
      - name: Run Neural Network Experiment
        run: python experiments/experiment_nn.py
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: nn-results
          path: results/nn_results.csv

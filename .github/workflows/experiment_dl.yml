name: Deep Learning Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/experiment_dl.py'
      - 'algorithms/deep_learning.py'
      - 'dataset/**'

jobs:
  run_experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn # tambahkan library lain kalau dibutuhkan
      - name: Run Deep Learning Experiment
        run: python experiments/experiment_dl.py
